name: Bug report
description: A control does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        **Security vulnerabilities do not go here.** See [SECURITY.md](https://github.com/cordango/web-controls/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you rendered, and what happened instead of what you expected.
      placeholder: I passed a manifest with a read-only field to CordangoFieldInput and …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: The props
      description: |
        For anything to do with a component, this is the most useful thing you can give us — the
        props you passed, or the smallest set that still shows the problem. A manifest fragment or a
        row of data counts.
      render: js

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything Vue, Vuetify or the browser printed.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: "The `@cordango/web-controls` version, or the commit if you built from source."
      placeholder: 0.1.0-alpha.0
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Where you saw it
      options:
        - Cordango Platform
        - An application generated by Cordango
        - My own Vue application
    validations:
      required: true

  - type: input
    id: peers
    attributes:
      label: Vue and Vuetify versions
      placeholder: vue 3.5.39, vuetify 4.1.2
